name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned packages
        run: pip install -r requirements-lock.txt # includes PuLP 3.x for the CBC cross-check

      - name: Unit tests
        run: python -m pytest -q

      - name: Run the pipeline
        run: python run_all.py

      - name: Compare results with the committed run
        # every reported number is in this generated file
        run: git diff --exit-code docs/results.md

      - uses: actions/upload-artifact@v7
        if: always() # keep the results for inspection when the comparison fails
        with:
          name: results
          path: |
            docs/
            outputs/budget_sweep.csv

  oldest-python:
    # README promises Python 3.10+: newest packages that still support it, minimums from requirements.txt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install packages
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -q

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
